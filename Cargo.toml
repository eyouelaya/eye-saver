[workspace]
members = ["crates/core", "crates/platform", "crates/app", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.6"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/eyouelaya/eye-saver"
authors = ["EyeSaver contributors"]

[workspace.dependencies]
eye-saver-core = { path = "crates/core" }
eye-saver-platform = { path = "crates/platform" }

serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1"
log = { version = "0.4.34", features = ["std"] }

# Tray / menu bar: standalone crates. No webview, no plugin framework.
tray-icon = "0.26"
muda = "0.21"
winit = "0.30.13"

# Settings window: pure Rust egui on the glow (OpenGL) backend - no wgpu, no webview.
egui = "0.36"
# "links" is what makes a clicked hyperlink open in the default browser.
egui-winit = { version = "0.36", default-features = false, features = ["links"] }
egui_glow = { version = "0.36", default-features = false, features = ["winit"] }
# Asks the OS to open a URL in the default browser, for the tray's "Check for updates".
# The same crate egui-winit's "links" feature already brings in; it is not a webview.
webbrowser = "1.2"
glutin = "0.32"
glutin-winit = "0.5"
raw-window-handle = "0.6"

notify-rust = { version = "4.18", features = ["preview-macos-un"] }

# macOS only: being told when the display sleeps and wakes, which AppKit announces through
# NSWorkspace and nowhere else.
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "NSNotification",
    "NSOperation",
    "NSString",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace"] }

windows = "0.62"

png = "0.18"
proptest = "1.11"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
