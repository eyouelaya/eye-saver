[package]
name = "eye-saver-platform"
description = "Operating-system adapters for EyeSaver: tray, notifications, power events, autostart."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Part of the EyeSaver application, not a library meant for crates.io.
publish = false

[dependencies]
eye-saver-core = { workspace = true }
log = { workspace = true }
tray-icon = { workspace = true }
muda = { workspace = true }
notify-rust = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemServices",
    "Win32_UI_WindowsAndMessaging",
] }
