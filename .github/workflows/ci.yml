name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # GitHub no longer offers a hosted Intel macOS runner (macos-13 and earlier are
  # retired), so the x86_64 leg runs on the same Apple-silicon runner as the others and
  # is tested through Rosetta 2, which ships pre-installed on GitHub's arm64 macOS
  # images for exactly this. That is a real test run under emulation, not a stand-in.
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, name: macOS (Apple silicon / aarch64) }
          - { os: macos-14, target: x86_64-apple-darwin, name: macOS (Intel / x86_64, via Rosetta) }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: Windows (x86_64) }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, name: Windows (aarch64) }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Tests
        run: cargo test --workspace --target ${{ matrix.target }}

  # The coverage gate is a property of the code rather than of the host, so it runs once.
  # The excluded paths are the OS adapters and the event loop, which need a desktop
  # session; see "Testing" in the README.
  coverage:
    name: Coverage gate (>=95% of the testable code)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Measure and enforce
        run: |
          cargo llvm-cov --workspace --summary-only \
            --ignore-filename-regex '(crates/app/|crates/platform/src/os/|xtask/)' \
            --fail-under-lines 95

  # EyeSaver ships for two operating systems from one source tree. The `check` matrix
  # above already exercises macOS (both architectures, the x86_64 one via Rosetta) and
  # each Windows architecture on its own hardware; what is still missing is a check that
  # the Windows adapters build correctly for *both* Windows architectures from a single
  # run, since nothing else cross-compiles them together.
  cross-check:
    name: Cross-target type check (Windows, from macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p eye-saver-platform --target x86_64-pc-windows-msvc
      - run: cargo check -p eye-saver-platform --target aarch64-pc-windows-msvc

  # Package.wxs is otherwise only compiled by release.yml, which is too late to find out
  # that it does not build. This proves the installer can be produced; what it does when
  # run still has to be tried by hand. The MSI is kept as an artifact for exactly that.
  installer:
    name: Windows installer builds (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install WiX
        # Pinned to v4 for the reasons given in release.yml.
        run: dotnet tool install --global wix --version 4.0.6
      - name: Build the installer
        run: ./packaging/windows/build-msi.ps1 -Arch x64
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-msi
          path: dist/*.msi
          retention-days: 7
