name: Release-plz

# Keeps one pull request up to date proposing the next version, computed from Conventional
# Commits merged since the last release (see release-plz.toml and README.md's "Releasing"
# section) - and, separately, cuts the actual tag and GitHub Release the moment that PR's
# version bump lands on main.
#
# release-plz-release pushes that tag using the default GITHUB_TOKEN, and GitHub
# deliberately does not let a GITHUB_TOKEN-authored push trigger *other* workflows (its
# anti-recursion protection) - so release.yml's own `tags: ['v*']` trigger alone would
# never fire for it. build-installers calls release.yml directly instead, job-to-job
# within this same run, which sidesteps that restriction entirely.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write

jobs:
  # Tags and releases, but only does anything the moment Cargo.toml's version has moved
  # past the latest tag - which in practice only happens right after release-plz-pr's own
  # PR (below) gets merged. An ordinary feature/fix merge leaves the version untouched, so
  # this is a silent no-op for every push except that one.
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - id: release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Read the tag that was just released
        id: tag
        if: steps.release.outputs.releases_created == 'true'
        run: |
          tag=$(jq -r '.[0].tag' <<< '${{ steps.release.outputs.releases }}')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # Only runs right after release-plz-release actually cut something - i.e. only on the
  # push where the release PR was just merged.
  build-installers:
    name: Build and attach installers
    needs: release-plz-release
    if: needs.release-plz-release.outputs.released == 'true'
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ needs.release-plz-release.outputs.tag }}
    secrets: inherit

  # Opens or updates the "chore: release vX.Y.Z" PR. release-plz is idempotent here: if
  # nothing releasable has landed since the last one, it leaves any existing PR as-is
  # rather than opening a duplicate or an empty one.
  #
  # It waits for release-plz-release, and must: on the push that merges a release PR the
  # two jobs would otherwise start together, and this one would check out the repository
  # a moment before the new tag is pushed. Seeing only the previous tag, it takes the
  # version that has just been released for one still waiting to be, and opens a second,
  # leftover "chore: release" PR for it. Running afterwards, it finds the tag and has
  # nothing to do. `!cancelled()` keeps it running even if the release job failed, so one
  # broken release cannot also stop the next release PR from being proposed.
  release-plz-pr:
    name: Release-plz PR
    needs: release-plz-release
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
